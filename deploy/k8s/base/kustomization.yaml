apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ml-serving
labels:
  - pairs:
      app.kubernetes.io/name: ml-service
      app.kubernetes.io/part-of: ml-serving-observability
    includeSelectors: false
resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - cronjob-drift.yaml
images:
  - name: ml-service
    newName: ghcr.io/gurmeher23/ml-serving-observability
    newTag: latest
