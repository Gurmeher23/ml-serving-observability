global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: ml-service
    static_configs:
      - targets: ["ml-service:8000"]
  # The drift job is short-lived, so it pushes its gauges here instead of being scraped.
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
