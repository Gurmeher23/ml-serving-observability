{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ml-service.fullname" . }}
  labels: {{- include "ml-service.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # /metrics and /captured are cluster-internal: only the public API is exposed.
          - path: /predict
            pathType: Exact
            backend:
              service:
                name: {{ include "ml-service.fullname" . }}
                port: {name: http}
          - path: /ready
            pathType: Exact
            backend:
              service:
                name: {{ include "ml-service.fullname" . }}
                port: {name: http}
{{- end }}
