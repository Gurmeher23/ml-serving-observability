apiVersion: batch/v1
kind: CronJob
metadata:
  name: drift-check
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: drift-check
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: drift-check
              image: ml-service
              imagePullPolicy: IfNotPresent
              command: ["python", "-m", "monitoring.drift_job"]
              args:
                - --reference=/app/reference/reference.csv
                - --source=http://ml-service/captured
                - --out-dir=/tmp/reports
                - --min-samples=200
                # Add --pushgateway=<host:port> to export drift gauges to Prometheus.
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits: {cpu: 500m, memory: 512Mi}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
